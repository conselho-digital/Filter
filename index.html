<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Filter — Janela Virtual por Gestos</title>
  <meta name="description" content="Filtro de vídeo em tempo real controlado por gestos das mãos e piscadas de olho." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <video id="camera-feed" playsinline muted autoplay></video>
  <canvas id="output-canvas"></canvas>

  <div id="hud" hidden>
    <span id="hud-shape">Janela: —</span>
    <span id="hud-sep">·</span>
    <span id="hud-filter">Filtro: —</span>
  </div>

  <div id="loading-indicator" hidden>
    <div class="spinner"></div>
    <p>Carregando modelos…</p>
  </div>

  <div id="error-banner" role="alert" hidden></div>

  <div id="controls">
    <button id="start-btn" type="button">Iniciar Câmera</button>
    <button id="toggle-camera-btn" type="button" hidden>Trocar Câmera</button>
    <button id="lock-filter-btn" type="button" hidden aria-pressed="false">🔓 Travar Filtro</button>
    <button id="add-frame-btn" type="button" hidden>✨ Frame</button>
    <button id="shape-cycle-btn" type="button" hidden>▭ Formato</button>
    <button id="settings-btn" type="button" aria-label="Configurações">⚙️</button>
  </div>

  <div id="settings-overlay" hidden>
    <div id="settings-panel" role="dialog" aria-modal="true" aria-label="Configurações">
      <h2>Configurações</h2>

      <label class="settings-row">
        <span>Espelhar câmera frontal</span>
        <input type="checkbox" id="setting-mirror" />
      </label>

      <label class="settings-row">
        <span>Trocar filtro ao piscar</span>
        <input type="checkbox" id="setting-blink-enabled" />
      </label>

      <label class="settings-row">
        <span>Gestos extras (punho trava filtro, positivo cria frame)</span>
        <input type="checkbox" id="setting-extra-gestures" />
      </label>

      <label class="settings-row settings-row-slider">
        <span>Escurecimento do fundo</span>
        <input type="range" id="setting-darken" min="0" max="80" step="5" />
      </label>

      <label class="settings-row settings-row-slider">
        <span>Sensibilidade dos dedos</span>
        <input type="range" id="setting-finger" min="5" max="30" step="1" />
      </label>

      <label class="settings-row settings-row-slider">
        <span>Sensibilidade da piscada</span>
        <input type="range" id="setting-blink-sens" min="30" max="70" step="5" />
      </label>

      <button id="settings-reset-btn" type="button">Restaurar padrão</button>
      <button id="settings-close-btn" type="button">Fechar</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
